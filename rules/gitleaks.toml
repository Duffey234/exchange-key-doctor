# exchange-key-doctor: gitleaks rules for crypto exchange API credentials
# (Binance, Bybit, OKX, Bitget). gitleaks' default config has no rules for these.
# Use: add to your .gitleaks.toml with  [extend] useDefault = true  and paste these rules,
# or run:  gitleaks detect --config node_modules/exchange-key-doctor/rules/gitleaks.toml
# What to do if one fires: https://quantaira.app/api-key-leak-tracker?utm_source=npm&utm_medium=cli&utm_campaign=exchange-key-doctor
# Generated by src/gitleaks.js; do not edit by hand.

title = "exchange-key-doctor"

[extend]
useDefault = true

[[rules]]
id = "binance-api-credential"
description = "Binance API key or secret"
regex = '''(?i)binance[\w.-]{0,20}(?:api[_.-]?key|apikey|key|secret|secret[_.-]?key|api[_.-]?secret)["'`]?\s*(?::|=|=>|:=)\s*["'`]?([A-Za-z0-9]{64})(?:$|["'`\s,;)}\]#])'''
secretGroup = 1
entropy = 4.0
keywords = ["binance"]
[[rules.allowlists]]
stopwords = ["example", "sample", "dummy", "placeholder", "changeme", "your", "xxxx", "test", "fake", "redacted", "abcdef0123", "0123456789"]

[[rules]]
id = "bybit-api-key"
description = "Bybit API key"
regex = '''(?i)bybit[\w.-]{0,20}(?:api[_.-]?key|apikey|key)["'`]?\s*(?::|=|=>|:=)\s*["'`]?([A-Za-z0-9]{18})(?:$|["'`\s,;)}\]#])'''
secretGroup = 1
entropy = 3.2
keywords = ["bybit"]
[[rules.allowlists]]
stopwords = ["example", "sample", "dummy", "placeholder", "changeme", "your", "xxxx", "test", "fake", "redacted", "abcdef0123", "0123456789"]

[[rules]]
id = "bybit-api-secret"
description = "Bybit API secret"
regex = '''(?i)bybit[\w.-]{0,20}(?:secret|api[_.-]?secret|secret[_.-]?key)["'`]?\s*(?::|=|=>|:=)\s*["'`]?([A-Za-z0-9]{36})(?:$|["'`\s,;)}\]#])'''
secretGroup = 1
entropy = 3.6
keywords = ["bybit"]
[[rules.allowlists]]
stopwords = ["example", "sample", "dummy", "placeholder", "changeme", "your", "xxxx", "test", "fake", "redacted", "abcdef0123", "0123456789"]

[[rules]]
id = "okx-api-key"
description = "OKX API key"
regex = '''(?i)ok(?:x|ex)[\w.-]{0,20}(?:api[_.-]?key|apikey|access[_.-]?key|key)["'`]?\s*(?::|=|=>|:=)\s*["'`]?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(?:$|["'`\s,;)}\]#])'''
secretGroup = 1
entropy = 3.0
keywords = ["okx", "okex"]
[[rules.allowlists]]
stopwords = ["example", "sample", "dummy", "placeholder", "changeme", "your", "xxxx", "test", "fake", "redacted", "abcdef0123", "0123456789"]

[[rules]]
id = "okx-api-secret"
description = "OKX API secret"
regex = '''(?i)ok(?:x|ex)[\w.-]{0,20}(?:secret|api[_.-]?secret|secret[_.-]?key)["'`]?\s*(?::|=|=>|:=)\s*["'`]?([0-9A-Fa-f]{32})(?:$|["'`\s,;)}\]#])'''
secretGroup = 1
entropy = 3.2
keywords = ["okx", "okex"]
[[rules.allowlists]]
stopwords = ["example", "sample", "dummy", "placeholder", "changeme", "your", "xxxx", "test", "fake", "redacted", "abcdef0123", "0123456789"]

[[rules]]
id = "bitget-api-key"
description = "Bitget API key (bg_ prefix)"
regex = '''(?:^|[^A-Za-z0-9_])(bg_[0-9a-f]{32})(?:$|[^0-9A-Za-z])'''
secretGroup = 1
entropy = 3.0
keywords = ["bg_"]
[[rules.allowlists]]
stopwords = ["example", "sample", "dummy", "placeholder", "changeme", "your", "xxxx", "test", "fake", "redacted", "abcdef0123", "0123456789"]

[[rules]]
id = "bitget-api-secret"
description = "Bitget API secret"
regex = '''(?i)bitget[\w.-]{0,20}(?:secret|api[_.-]?secret|secret[_.-]?key)["'`]?\s*(?::|=|=>|:=)\s*["'`]?([0-9a-f]{64})(?:$|["'`\s,;)}\]#])'''
secretGroup = 1
entropy = 3.5
keywords = ["bitget"]
[[rules.allowlists]]
stopwords = ["example", "sample", "dummy", "placeholder", "changeme", "your", "xxxx", "test", "fake", "redacted", "abcdef0123", "0123456789"]
